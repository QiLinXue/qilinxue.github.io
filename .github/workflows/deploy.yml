name: Deploy to GitHub Pages (DISABLED - Use Docker deployment instead)

# DISABLED - Using Docker deployment instead
on:
  workflow_dispatch: # Only manual trigger, no automatic triggers

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build
      run: npm run build
      
    - name: Copy .htaccess file
      run: cp public/.htaccess dist/.htaccess
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
